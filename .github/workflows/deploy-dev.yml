name: Deploy development

on:
  workflow_dispatch:
    inputs:
      enable_paid_azure:
        description: 'Recreate paid Azure resources (recurring charges)'
        type: boolean
        required: true
        default: false

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-agentic-operations-dev
  # A resource group's own region is immutable. The existing group is in West Europe.
  RESOURCE_GROUP_LOCATION: westeurope
  # Application resources use Sweden Central because West Europe currently rejects new resources for this subscription.
  DEPLOYMENT_LOCATION: swedencentral
  APP_NAME: agenticops
  REGISTRY: agenticopsphilippe2026

jobs:
  deploy:
    if: ${{ inputs.enable_paid_azure == true }}
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Create resource group
        run: az group create --name "$RESOURCE_GROUP" --location "$RESOURCE_GROUP_LOCATION"
      - name: Deploy shared platform
        run: >-
          az deployment group create --resource-group "$RESOURCE_GROUP" --template-file infra/main.bicep
          --parameters location=$DEPLOYMENT_LOCATION containerRegistryName=$REGISTRY apiImage=$REGISTRY.azurecr.io/api:bootstrap dashboardImage=$REGISTRY.azurecr.io/dashboard:bootstrap deployApplications=false
      - name: Build and push images
        run: |
          az acr build --registry "$REGISTRY" --image api:${{ github.sha }} --file src/AgenticOperations.Api/Dockerfile .
          az acr build --registry "$REGISTRY" --image dashboard:${{ github.sha }} --file src/AgenticOperations.Dashboard/Dockerfile .
      - name: Deploy applications
        run: >-
          az deployment group create --resource-group "$RESOURCE_GROUP" --template-file infra/main.bicep
          --parameters location=$DEPLOYMENT_LOCATION containerRegistryName=$REGISTRY apiImage=$REGISTRY.azurecr.io/api:${{ github.sha }} dashboardImage=$REGISTRY.azurecr.io/dashboard:${{ github.sha }} deployApplications=true
